# T-1001 + T-1002 — CI: valida cada PR antes de mergear
#
# Dois jobs em paralelo:
#   - api:  Postgres 16 service + uv sync + ruff + pytest
#   - web:  pnpm install + typecheck + build (garante que `next build`
#           passa antes do deploy — evita o hotfix Next 16 (#24) de novo)
#
# Ambos precisam passar pro PR poder mergear (T-1003 configura o gate).
name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Cancela runs antigos ao push novo no mesmo PR/branch (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: registers_app
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      # uv gerencia Python + venv + deps; toolchain identica ao dev/prod.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # `~/.cache/uv` — cache-key baseada no uv.lock por padrão.

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check app tests

      - name: Ruff (format check)
        run: uv run ruff format --check app tests

      # Pytest cria o DB `registers_test` via conftest (usa a connection
      # de admin ao DB `postgres`). Bastam host/porta do service acima.
      - name: Pytest
        run: uv run pytest -q
        env:
          PGHOST: localhost
          PGPORT: "5432"

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Casa com `packageManager` do package.json (pnpm@10.12.1).
          version: 10.12.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build
        run: pnpm --filter web build
        env:
          # O build do Next.js quer estas envs no compile-time; valores
          # dummy só pra passar. Runtime real usa .env.production na VPS.
          NEXT_PUBLIC_API_URL: /api
          INTERNAL_API_URL: http://api:8000
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify service worker (INV-11)
        run: pnpm --filter web verify:sw
