# T-1001 + T-1002 — CI: valida cada PR antes de mergear
#
# Dois jobs em paralelo:
#   - api:  Postgres 16 service + uv sync + ruff + pytest
#   - web:  pnpm install + typecheck + build (garante que `next build`
#           passa antes do deploy — evita o hotfix Next 16 (#24) de novo)
#
# Ambos precisam passar pro PR poder mergear (T-1003 configura o gate).
name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Cancela runs antigos ao push novo no mesmo PR/branch (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: registers_app
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      # uv gerencia Python + venv + deps; toolchain identica ao dev/prod.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # `~/.cache/uv` — cache-key baseada no uv.lock por padrão.

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check app tests

      - name: Ruff (format check)
        run: uv run ruff format --check app tests

      # Pytest cria o DB `registers_test` via conftest (usa a connection
      # de admin ao DB `postgres`). Bastam host/porta do service acima.
      - name: Pytest
        run: uv run pytest -q
        env:
          PGHOST: localhost
          PGPORT: "5432"

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Casa com `packageManager` do package.json (pnpm@10.12.1).
          version: 10.12.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build
        run: pnpm --filter web build
        env:
          # O build do Next.js quer estas envs no compile-time; valores
          # dummy só pra passar. Runtime real usa .env.production na VPS.
          NEXT_PUBLIC_API_URL: /api
          INTERNAL_API_URL: http://api:8000
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify service worker (INV-11)
        run: pnpm --filter web verify:sw

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # So roda depois de unit tests + build verdes: sem sentido gastar minutos
    # rodando browser contra codigo que nao passou lint/type/pytest.
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache do bundle de browsers (~150 MB) por versao do @playwright/test.
      # `pnpm-lock.yaml` como key funciona porque a versao esta la; se mudar,
      # cache miss reforca reinstall.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (with deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Cache-hit ainda precisa das system libs (libnss3, etc.) do chromium.
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Bring up e2e stack (docker-compose.e2e.yml)
        run: ./scripts/e2e-bootstrap.sh

      - name: Run Playwright suite
        run: pnpm --filter web test:e2e

      - name: Dump api container logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs api | tail -200

      - name: Upload Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Tear down e2e stack
        if: always()
        run: ./scripts/e2e-bootstrap.sh --down
