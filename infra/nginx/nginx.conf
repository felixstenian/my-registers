# app_plan.md §14.6 — nginx principal.
#
# Encaminhamento por `conf.d/*.conf`, que o entrypoint da imagem oficial
# preenche fazendo envsubst nos `templates/*.template` (single-source em
# `infra/nginx/templates/app.conf.template`). Ver README do serviço.
# `client_max_body_size 15m` cobre 4 imagens de 8MB + margem multipart —
# equivale ao SP-11 (foto ≤ 8MB, até 4 por mensagem).

user  nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_max_body_size 15m;
  client_body_timeout 60s;
  client_header_timeout 15s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml;

  log_format main '$remote_addr - "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  include /etc/nginx/conf.d/*.conf;
}
