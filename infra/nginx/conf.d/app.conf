# app_plan.md §14.6 — virtual host da app.
#
# Config usa a variável de ambiente `${DOMAIN}` — substituída no boot pelo
# comando `envsubst` (veja infra/nginx/entrypoint.sh, se usar) ou o `sed`
# do bootstrap. Alternativa: hardcodar o domínio direto neste arquivo.
#
# Sem HSTS preload por padrão — habilite `preload` só quando tiver
# certeza (uma vez incluído no preload list é praticamente irreversível).

# HTTP → HTTPS redirect + ACME challenge.
server {
  listen 80;
  server_name ${DOMAIN};

  # Certbot webroot mode escreve os arquivos de challenge aqui.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS principal.
server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # OCSP stapling (reduz round-trip do cliente na validação).
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  # --- Segurança / headers (checklist §16) ---
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
  # CSP mínimo para Next.js + tailwind. `unsafe-inline` necessário para os
  # estilos gerados no build; ajustar quando trocar para nonce/sha256.
  add_header Content-Security-Policy
    "default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    always;

  # --- Backend REST + chat ---
  # Reescreve `/api/foo` → `http://api:8000/foo`. O trailing slash em
  # `proxy_pass` é importante — sem ele o path original é preservado.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    # Chat pode ter respostas ~30s por causa do LLM. 120s é margem.
  }

  # --- Mídia (MinIO servida pelo mesmo domínio) ---
  # Reescreve `/media/<bucket>/<key>` → `http://minio:9000/<bucket>/<key>`.
  # O `S3_PUBLIC_BASE_URL` do backend reescreve o host da URL assinada pra
  # `https://${DOMAIN}/media` — nginx redireciona pro MinIO interno.
  #
  # Necessário porque:
  #   1. MinIO só existe na rede docker `internal` (browser não alcança).
  #   2. CSP `img-src 'self'` exige mesma origem — proxy pelo domínio
  #      principal satisfaz sem afrouxar CSP.
  #
  # Só GET faz sentido: put_object usa endpoint interno via API.
  # A URL carrega assinatura na query string (S3v4), então nenhuma auth
  # extra é necessária no nginx.
  #
  # `client_max_body_size` herdado do bloco `http` — se um dia servir
  # upload via proxy, ajustar aqui.
  location /media/ {
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    # Cache leve pro browser: URL assinada expira em 1h, então reusar
    # dentro desse período é seguro. `private` porque cada URL é única
    # por chave + expiry.
    add_header Cache-Control "private, max-age=3600" always;
  }

  # --- Frontend Next.js standalone ---
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}
